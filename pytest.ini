[pytest]
pythonpath = .
testpaths = tests
# `live` tests call the real OpenAI API: they only run when asked for explicitly (pytest -m live).
addopts = -q -m "not live"
markers =
    live: needs a real OPENAI_API_KEY and network access (opt-in; skipped without a key)
filterwarnings =
    ignore::DeprecationWarning
