# WF010 - Workflow Performance Report
workflow_id: WF010
routing_examples:
  - Show me a performance report for our workflows
  - Which automations are slow or unreliable?
  - What is the failure rate of each workflow?
routing_keywords: [performance, performance report, failing, failure rate, failures, slow, execution time, logs, success rate, errors, reliability]

examples:
  - title: Excel test question
    request: "Which workflows are failing most often?"

interpretation_notes:
  - "Input is a step-level execution log (run_id, workflow_id, step_name, step_status, step_duration_sec, error_message). A run FAILED if any of its steps failed; run duration = sum of its step durations. The default log is simulated history (data/fixtures/workflow_execution_logs.csv, generated by scripts/generate_fixtures.py)."
  - "Excel decision logic: 'Flag workflows with failure rate above 10% or average execution time above defined threshold'. The failure threshold (10%) is from the workbook; the workbook does not define the time threshold, so slow_run_threshold_sec defaults to 30 seconds and is an overridable input. Comparisons are strict (>)."
  - "A 'slow step' is a step whose average duration exceeds slow_step_threshold_sec (default 5 s, also not defined in the workbook)."
  - "Recommendations are rule-generated from the flags, the most frequent error and the slowest step of each flagged workflow; they are not LLM output."
error_handling_notes:
  - "Rows with non-numeric durations are treated as missing and reported; an unreadable or incomplete log file stops the workflow with the missing column names."

inputs:
  - name: logs_file
    type: file
    description: Workflow execution log CSV.
    default: workflow_execution_logs.csv
    covers: ["Workflow execution logs"]
  - name: failure_rate_threshold_pct
    type: number
    minimum: 0
    maximum: 100
    default: 10
    description: Flag workflows whose failure rate is above this percentage.
    aliases: [threshold, failure threshold]
  - name: slow_run_threshold_sec
    type: number
    minimum: 0
    default: 30
    description: Flag workflows whose average run time is above this many seconds.
  - name: slow_step_threshold_sec
    type: number
    minimum: 0
    default: 5
    description: A step is slow when its average duration is above this many seconds.
  - name: top_n
    type: integer
    minimum: 1
    maximum: 50
    default: 5
    description: How many frequent errors / slow steps to list.

tool_map:
  "CSV/database reader": [csv_reader]
  "calculator": [table_aggregate, table_query, table_join]
  "reporting": [report_builder]

steps:
  - id: load_logs
    name: Load execution logs
    excel_step: Load execution logs
    tool: csv_reader
    params:
      source: "=inputs.logs_file"
      numeric_columns: [step_duration_sec]
      required_columns: [run_id, workflow_id, step_name, step_status, step_duration_sec]
    ensure:
      - expr: "output.row_count > 0"
        message: "The log file contains no rows."
        category: user_correctable

  - id: build_run_table
    name: Collapse step logs into runs
    excel_step: calculate success/failure rate
    tool: table_aggregate
    params:
      rows: "=steps.load_logs.rows"
      group_by: [workflow_id, run_id]
      aggregations:
        failed_steps: {op: count_if, where: "row.step_status == 'failed'"}
        run_duration_sec: {op: sum, field: step_duration_sec}

  - id: mark_failed_runs
    name: Mark failed runs
    excel_step: calculate success/failure rate
    tool: table_query
    params:
      rows: "=steps.build_run_table.rows"
      derive:
        run_failed: "row.failed_steps > 0"

  - id: count_runs
    name: Count runs and failures per workflow
    excel_step: calculate success/failure rate
    tool: table_aggregate
    params:
      rows: "=steps.mark_failed_runs.rows"
      group_by: [workflow_id]
      aggregations:
        runs: {op: count}
        failed_runs: {op: count_if, where: "row.run_failed"}
      sort_by: [workflow_id]

  - id: failure_rates
    name: Calculate failure and success rates
    excel_step: calculate success/failure rate
    tool: table_query
    params:
      rows: "=steps.count_runs.rows"
      derive:
        failure_rate_pct: "round(row.failed_runs / row.runs * 100, 1)"
        success_rate_pct: "round(100 - row.failure_rate_pct, 1)"

  - id: average_run_time
    name: Calculate average execution time
    excel_step: calculate average execution time
    tool: table_aggregate
    params:
      rows: "=steps.mark_failed_runs.rows"
      group_by: [workflow_id]
      aggregations:
        avg_duration_sec: {op: avg, field: run_duration_sec}
      decimals: 1

  - id: join_run_time
    name: Combine rates and run times
    excel_step: calculate average execution time
    tool: table_join
    params:
      left: "=steps.failure_rates.rows"
      right: "=steps.average_run_time.rows"
      left_key: workflow_id
      right_key: workflow_id
      how: left

  - id: flag_workflows
    name: Flag workflows
    excel_step: calculate average execution time
    description: "Excel rule: flag workflows with a failure rate above 10% or an average execution time above the defined threshold."
    tool: table_query
    params:
      rows: "=steps.join_run_time.rows"
      vars:
        max_failure_pct: "=inputs.failure_rate_threshold_pct"
        max_run_sec: "=inputs.slow_run_threshold_sec"
      derive:
        flag_failure: "row.failure_rate_pct > vars.max_failure_pct"
        flag_slow: "row.avg_duration_sec > vars.max_run_sec"
        flagged: "row.flag_failure or row.flag_slow"
      sort_by: ["-failure_rate_pct", workflow_id]
      label: "Excel rule: failure rate above threshold or average time above threshold"

  - id: error_rows
    name: Select failed steps with an error message
    excel_step: identify frequent errors
    tool: table_query
    params:
      rows: "=steps.load_logs.rows"
      where: "row.step_status == 'failed' and not is_blank(row.error_message)"

  - id: count_errors
    name: Count errors
    excel_step: identify frequent errors
    tool: table_aggregate
    params:
      rows: "=steps.error_rows.rows"
      group_by: [workflow_id, step_name, error_message]
      aggregations:
        occurrences: {op: count}
      sort_by: ["-occurrences", workflow_id]

  - id: frequent_errors
    name: Most frequent errors
    excel_step: identify frequent errors
    tool: table_query
    params:
      rows: "=steps.count_errors.rows"
      limit: "=inputs.top_n"

  - id: top_error_by_workflow
    name: Top error per workflow
    excel_step: identify frequent errors
    tool: table_aggregate
    params:
      rows: "=steps.count_errors.rows"
      group_by: [workflow_id]
      aggregations:
        top_error: {op: first, field: error_message}
        top_error_count: {op: first, field: occurrences}

  - id: step_durations
    name: Average duration per step
    excel_step: identify slow steps
    tool: table_aggregate
    params:
      rows: "=steps.load_logs.rows"
      group_by: [workflow_id, step_name]
      aggregations:
        executions: {op: count}
        avg_step_sec: {op: avg, field: step_duration_sec}
      decimals: 1

  - id: slow_steps
    name: Identify slow steps
    excel_step: identify slow steps
    tool: table_query
    params:
      rows: "=steps.step_durations.rows"
      vars:
        slow_sec: "=inputs.slow_step_threshold_sec"
      where: "row.avg_step_sec > vars.slow_sec"
      sort_by: ["-avg_step_sec", workflow_id]
      limit: "=inputs.top_n"
      label: Slow steps (average duration above threshold)

  - id: slowest_by_workflow
    name: Slowest step per workflow
    excel_step: identify slow steps
    tool: table_aggregate
    params:
      rows: "=steps.slow_steps.rows"
      group_by: [workflow_id]
      aggregations:
        slowest_step: {op: first, field: step_name}
        slowest_step_sec: {op: first, field: avg_step_sec}

  - id: flagged_only
    name: Flagged workflows
    excel_step: generate recommendations
    tool: table_query
    params:
      rows: "=steps.flag_workflows.rows"
      where: "row.flagged"
      label: Flagged workflows

  - id: attach_top_errors
    name: Attach most common error
    excel_step: generate recommendations
    tool: table_join
    params:
      left: "=steps.flagged_only.rows"
      right: "=steps.top_error_by_workflow.rows"
      left_key: workflow_id
      right_key: workflow_id
      how: left
      right_fields: [top_error, top_error_count]

  - id: attach_slowest_steps
    name: Attach slowest step
    excel_step: generate recommendations
    tool: table_join
    params:
      left: "=steps.attach_top_errors.rows"
      right: "=steps.slowest_by_workflow.rows"
      left_key: workflow_id
      right_key: workflow_id
      how: left
      right_fields: [slowest_step, slowest_step_sec]

  - id: build_recommendations
    name: Generate recommendations
    excel_step: generate recommendations
    tool: table_query
    params:
      rows: "=steps.attach_slowest_steps.rows"
      derive:
        recommendation: "strip(iff(row.flag_failure, 'Investigate failures: ' + str(row.failure_rate_pct) + '% of runs failed' + iff(is_blank(row.top_error), '', ' (most common error: ' + row.top_error + ')') + '. ', '') + iff(row.flag_slow, 'Reduce run time: average ' + str(row.avg_duration_sec) + 's' + iff(is_blank(row.slowest_step), '', ' (slowest step: ' + row.slowest_step + ' at ' + str(row.slowest_step_sec) + 's)') + '.', ''))"
      select: [workflow_id, failure_rate_pct, avg_duration_sec, flag_failure, flag_slow, recommendation]

final:
  warnings:
    - when: "len(steps.load_logs.warnings) > 0"
      message: "{{ join(steps.load_logs.warnings, ' ') }}"
  outcomes:
    completed:
      headline: "{{ iff(steps.flagged_only.count == 0, 'No workflow exceeds the thresholds', str(steps.flagged_only.count) + ' of ' + str(steps.flag_workflows.count) + ' workflows need attention') }}"
      result:
        thresholds:
          failure_rate_pct: "=inputs.failure_rate_threshold_pct"
          slow_run_sec: "=inputs.slow_run_threshold_sec"
          slow_step_sec: "=inputs.slow_step_threshold_sec"
        runs_analyzed: "=steps.mark_failed_runs.count"
        workflow_metrics: "=steps.flag_workflows.rows"
        recommendations: "=steps.build_recommendations.rows"
        frequent_errors: "=steps.frequent_errors.rows"
        slow_steps: "=steps.slow_steps.rows"
